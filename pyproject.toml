[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinshood"
version = "0.1.0"
description = "Deterministic, evidence-first OSINT command-line toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual>=0.60"]

[project.scripts]
robinshood = "robinshood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
